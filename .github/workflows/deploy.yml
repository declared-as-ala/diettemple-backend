name: Deploy Backend

# Local push -> checks -> build image -> backup DB -> deploy -> migrations + recipe seed -> verification (-> rollback on failure)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Never two production deployments at once (the seed must not run twice in parallel).
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_URL: https://api.diettemple.tn

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Quality gate: type-check + build + recipe dataset / schema validation.
  #    Nothing is deployed if this fails.
  # ───────────────────────────────────────────────────────────────────────────
  checks:
    name: Checks (build + recipe dataset validation)
    runs-on: ubuntu-latest
    # A real MongoDB for the integration tests (invitations: unique indexes, atomic activation, expiry...).
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017/dt_ci_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Runs BEFORE any npm script / jest: those execute config files, so a poisoned one must never reach them.
      - name: Security gate (refuse the known obfuscated payload)
        run: |
          if git grep -nE "_0x[0-9a-f]{4,6}|global\.i *= *'|node init" -- . ':!node_modules' ':!package-lock.json' ':!.github'; then
            echo "::error::Known malicious payload markers found in the repository. Refusing to run anything."
            exit 1
          fi
          # A payload can hide behind a long run of whitespace: no config/script file may have a huge line.
          LONG=$(git ls-files '*.config.js' '*.config.mjs' '*.config.cjs' '*.config.ts' init api.js             | xargs -r awk 'length($0) > 2000 { print FILENAME ": line " FNR " has " length($0) " chars" }')
          if [ -n "$LONG" ]; then
            echo "$LONG"
            echo "::error::Abnormally long line in a config/script file (possible hidden payload)."
            exit 1
          fi
          echo "Security gate passed."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Type-check and build
        run: npm run build

      - name: Tests (recipes, history guard, client invitations incl. real-database integration)
        run: >
          npx jest --runInBand
          src/data/recipes
          src/services/recipeFilter.service.test.ts
          src/utils/exerciseHistoryGuard.test.ts
          src/services/invitation.unit.test.ts
          src/services/invitation.integration.test.ts

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Build and publish the backend image.
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: string
        run: |
          IMAGE_ID=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_id=ghcr.io/$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.string.outputs.image_id }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Deploy: BACKUP FIRST, then new image, then migrations and the recipe seed.
  #    The job fails (and nothing is reported as successful) if any step fails.
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare configuration files
        run: |
          echo "DOCKER_COMPOSE_B64=$(base64 -w 0 docker-compose.prod.yml)" >> $GITHUB_ENV
          echo "CADDYFILE_B64=$(base64 -w 0 Caddyfile)" >> $GITHUB_ENV

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKER_COMPOSE_B64: ${{ env.DOCKER_COMPOSE_B64 }}
          CADDYFILE_B64: ${{ env.CADDYFILE_B64 }}
        with:
          host: 178.105.255.135
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          envs: DOCKER_COMPOSE_B64,CADDYFILE_B64
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p /app/diettemple
            cd /app/diettemple

            # Write configuration files directly
            echo "$DOCKER_COMPOSE_B64" | base64 -d > docker-compose.yml
            echo "$CADDYFILE_B64" | base64 -d > Caddyfile

            # Log in to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Make sure directories and environment file exist
            mkdir -p backend backups
            touch backend/.env

            # ── 1. Database must be running, then BACKUP before anything changes ──────────────
            docker compose up -d mongodb
            sleep 3
            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            BACKUP="backups/pre-deploy-${STAMP}.archive.gz"
            docker exec diettemple_mongodb mongodump --archive=/tmp/pre-deploy.archive.gz --gzip
            docker cp diettemple_mongodb:/tmp/pre-deploy.archive.gz "$BACKUP"
            docker exec diettemple_mongodb rm -f /tmp/pre-deploy.archive.gz
            gzip -t "$BACKUP"                      # archive must be a valid gzip
            test "$(stat -c %s "$BACKUP")" -gt 1024  # and not empty
            echo "Database backup OK: $BACKUP ($(du -h "$BACKUP" | cut -f1))"
            # keep the 7 most recent backups
            ls -1t backups/pre-deploy-*.archive.gz | tail -n +8 | xargs -r rm -f

            # ── 2. New backend image ──────────────────────────────────────────────────────────
            docker compose pull backend
            docker compose up -d backend
            docker compose up -d mongodb caddy

            echo "Waiting for backend to be healthy..."
            for i in $(seq 1 40); do
              if docker exec diettemple_backend node -e "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "Backend healthy after ~$((i*3))s"
                break
              fi
              if [ "$i" -eq 40 ]; then
                echo "Backend did not become healthy" >&2
                docker logs --tail 60 diettemple_backend >&2 || true
                exit 1
              fi
              sleep 3
            done

            # ── 3. Migrations (existing) ──────────────────────────────────────────────────────
            # Pre-existing step: it never blocked a deployment before, so it stays non-blocking (but a failure is now visible).
            docker exec diettemple_backend node dist/scripts/backfillSubscriptionPlanAssignments.js || echo "::warning::backfillSubscriptionPlanAssignments failed (non-blocking)"
            docker exec diettemple_backend node dist/scripts/seedProducts.js || echo "Seed products skipped (might already exist or DB not ready)"

            # ── 4. Recipe catalogue: validate (dry run) -> apply -> verify ────────────────────
            # --apply validates the dataset, uploads the photos, publishes the new recipes and ARCHIVES (never deletes)
            # the legacy ones; on any failure it restores the previous catalogue by itself.
            docker exec diettemple_backend node dist/scripts/seedRecipes.js
            docker exec diettemple_backend node dist/scripts/seedRecipes.js --apply
            if ! docker exec diettemple_backend node dist/scripts/seedRecipes.js --verify --check-storage --base-url http://localhost:5000; then
              echo "Recipe verification failed: restoring the previous catalogue" >&2
              docker exec diettemple_backend node dist/scripts/seedRecipes.js --rollback
              exit 1
            fi

            # Cleanup old Docker images
            docker image prune -f

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Final gate: the PUBLIC site (through the reverse proxy, like the mobile app).
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify production (public API + photos)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Public recipe API and photos
        run: node scripts/verify-recipes-public.mjs "$API_URL"

  # ───────────────────────────────────────────────────────────────────────────
  # 5. If the public check fails after a successful deploy, bring the previous catalogue back.
  # ───────────────────────────────────────────────────────────────────────────
  rollback-recipes:
    name: Rollback recipe catalogue
    needs: [deploy, verify]
    if: ${{ always() && needs.deploy.result == 'success' && needs.verify.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore the previous recipe catalogue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.105.255.135
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script_stop: true
          script: |
            set -euo pipefail
            docker exec diettemple_backend node dist/scripts/seedRecipes.js --rollback
            echo "Previous recipe catalogue restored. Database backups are in /app/diettemple/backups"
